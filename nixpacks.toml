[phases.setup]
nixPkgs = ["python311"]

[phases.install]
cmds = [
  "python -m venv /opt/venv",
  "/opt/venv/bin/pip install --upgrade pip",
  "/opt/venv/bin/pip install -r requirements.txt"
]

[phases.build]
cmds = [
  "/opt/venv/bin/python manage.py migrate --noinput",
  "/opt/venv/bin/python manage.py create_app_user",
  "/opt/venv/bin/python manage.py collectstatic --noinput"
]

[start]
cmd = "/opt/venv/bin/gunicorn movie_booking.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120 --log-level info"
